<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Animal Profile</title>
    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <main class="profile-container">

        <header class="profile-header">
            <img id="cover-image" class="cover-image" alt="Profile cover">
        </header>

        <section class="profile-info">
            <img id="profile-image" class="profile-image" alt="Profile image">
            <h1 id="profile-name"></h1>
            <p id="profile-description"></p>
        </section>

        <section class="traits-section">
            <h2>Profile Information</h2>
            <div id="traits-list"></div>
        </section>

        <section class="reviews-section">
            <h2>Endorsements</h2>
            <div id="reviews-list"></div>
        </section>

        <section class="gallery-section">
            <h2>Gallery</h2>

            <div class="gallery">
                <img
                    id="gallery-image-1"
                    class="gallery-image"
                    alt="First profile gallery image"
                >

                <img
                    id="gallery-image-2"
                    class="gallery-image"
                    alt="Second profile gallery image"
                >
            </div>
        </section>

        <section class="friends-section">
            <h2>Meet the Whole Debugging Squad</h2>
            <div id="friends-list"></div>
        </section>

    </main>

    <script src="profile.js"></script>
</body>

</html>
