<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>My Profile</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Rammetto+One&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="profile.css">
</head>

<body>
    <main class="main-container">

        <header id="banner">
            <div class="banner-inner">
                <div class="profile-img-wrapper">
                    <img
                        id="profile-image"
                        class="profile-img"
                        src="myprofile/profile.png"
                        alt="Profile picture"
                    >
                </div>
            </div>
        </header>

        <h1 id="profile-name" class="main-title">
            My Profile
        </h1>

        <section class="content-block info-section">
            <div class="text-column">

                <p id="profile-description"></p>

                <div class="info-row">
                    <div class="info-label">
                        <p>Stats / Traits</p>
                    </div>

                    <div
                        id="traits-list"
                        class="info-value"
                    ></div>
                </div>

            </div>

            <div class="image-column">
                <img
                    id="gallery-image-1"
                    src="myprofile/image1.png"
                    alt="Animal main picture"
                >
            </div>
        </section>

        <section class="content-block endorsements-section">
            <div class="text-column">
                <h2>Endorsement</h2>
                <div id="reviews-list"></div>
            </div>

            <div class="image-column">
                <img
                    id="gallery-image-2"
                    src="myprofile/image2.png"
                    alt="Animal endorsement picture"
                >
            </div>
        </section>

        <section class="friends-section">
            <h2>Meet the Whole Debugging Squad</h2>
            <div
                id="friends-list"
                class="friends-grid"
            ></div>
        </section>

        <footer>
            Zefat Academic College
        </footer>

    </main>

    <script src="profile.js"></script>
</body>

</html>
